name: Backend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Ruff, tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.8.18'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --project backend --locked
      - name: Ruff lint
        run: uv run --project backend --locked ruff check backend scripts
      - name: Ruff formatting
        run: uv run --project backend --locked ruff format --check backend scripts
      - name: API tests
        run: uv run --project backend --locked pytest backend/tests
      - name: Build wheel and source distribution
        run: uv build --project backend
