name: Project CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml

  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml

  workflows:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run actionlint
        run: |
          docker run --rm --volume "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.11 -color

  compose:
    name: Docker Compose integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and wait for all healthchecks
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify application users
        run: |
          test "$(docker compose exec -T frontend id -u)" = 10001
          test "$(docker compose exec -T backend id -u)" = 10001
      - name: Verify PostgreSQL and Redis
        run: |
          docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1"'
          test "$(docker compose exec -T redis redis-cli ping)" = PONG
      - name: Verify HTTP, SSR and static assets
        run: python3 scripts/smoke-compose.py
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked Lighthouse dependencies
        run: pnpm install --frozen-lockfile
      - name: Lighthouse against the running stack
        id: lighthouse
        timeout-minutes: 5
        run: |
          CHROME_PATH="$(command -v google-chrome)"
          export CHROME_PATH
          pnpm lighthouse
          pnpm lighthouse:check
      - name: Upload Lighthouse report
        if: always() && steps.lighthouse.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: |
            frontend/lighthouse-report.report.html
            frontend/lighthouse-report.report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Container status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100
      - name: Stop stack and remove CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  ci:
    name: CI
    if: always()
    needs: [frontend, backend, workflows, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit(f"Checks did not pass: {', '.join(failed)}")
          print('All project checks passed')
          PY
